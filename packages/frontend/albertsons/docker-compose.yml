version: '3.9'

services:
  n8n:
    build:
      context: ../../../
      dockerfile: packages/frontend/albertsons/Dockerfile.n8n
    ports:
      - '5678:5678'

  albertsons:
    build:
      context: ../../../
      dockerfile: packages/frontend/albertsons/Dockerfile.albertsons
    ports:
      - '8080:8080'
    depends_on:
      - n8n
